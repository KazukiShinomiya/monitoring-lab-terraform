# ==========================================
# SNMP Exporter Configuration
# ==========================================
# 対象機器:
#   RTX830      : YOUR_ROUTER_IP   (モジュール: if_mib)
#   Synology NAS: YOUR_NAS_IP (モジュール: synology)
#
# コミュニティ名: monlab (read-only)
# バージョン: SNMPv2c

# ----- 認証設定 -----
auths:
  monlab_v1:
    community: monlab
    version: 1
  monlab_v2:
    community: monlab
    version: 2

# ----- モジュール定義 -----
modules:

  # ==========================================
  # if_mib: ネットワークインターフェース
  # 対象: RTX830 (WAN/LAN トラフィック・リンク状態)
  # ==========================================
  if_mib:
    walk:
      - 1.3.6.1.2.1.1.3     # sysUpTime
      - 1.3.6.1.2.1.2.2     # ifTable
      - 1.3.6.1.2.1.31.1.1  # ifXTable (64-bit カウンター)
    metrics:
      # システム稼働時間 (1/100秒単位)
      - name: sysUpTime
        oid: 1.3.6.1.2.1.1.3.0
        type: gauge
        help: System uptime in hundredths of a second

      # インターフェース 運用状態 (1=up, 2=down, 3=testing)
      - name: ifOperStatus
        oid: 1.3.6.1.2.1.2.2.1.8
        type: gauge
        help: "Operational status of interface (1=up, 2=down, 3=testing)"
        indexes:
          - labelname: ifIndex
            type: gauge
        lookups:
          - labels: [ifIndex]
            labelname: ifDescr
            oid: 1.3.6.1.2.1.2.2.1.2
            type: DisplayString

      # 受信バイト数 (64-bit カウンター: 高速回線でもオーバーフローしない)
      - name: ifHCInOctets
        oid: 1.3.6.1.2.1.31.1.1.1.6
        type: counter
        help: Incoming bytes on interface (64-bit counter)
        indexes:
          - labelname: ifIndex
            type: gauge
        lookups:
          - labels: [ifIndex]
            labelname: ifDescr
            oid: 1.3.6.1.2.1.2.2.1.2
            type: DisplayString

      # 送信バイト数 (64-bit カウンター)
      - name: ifHCOutOctets
        oid: 1.3.6.1.2.1.31.1.1.1.10
        type: counter
        help: Outgoing bytes on interface (64-bit counter)
        indexes:
          - labelname: ifIndex
            type: gauge
        lookups:
          - labels: [ifIndex]
            labelname: ifDescr
            oid: 1.3.6.1.2.1.2.2.1.2
            type: DisplayString

      # 受信エラー数
      - name: ifInErrors
        oid: 1.3.6.1.2.1.2.2.1.14
        type: counter
        help: Incoming errors on interface
        indexes:
          - labelname: ifIndex
            type: gauge
        lookups:
          - labels: [ifIndex]
            labelname: ifDescr
            oid: 1.3.6.1.2.1.2.2.1.2
            type: DisplayString

      # 送信エラー数
      - name: ifOutErrors
        oid: 1.3.6.1.2.1.2.2.1.20
        type: counter
        help: Outgoing errors on interface
        indexes:
          - labelname: ifIndex
            type: gauge
        lookups:
          - labels: [ifIndex]
            labelname: ifDescr
            oid: 1.3.6.1.2.1.2.2.1.2
            type: DisplayString

  # ==========================================
  # synology: Synology NAS リソース監視
  # 対象: Synology NAS (ストレージ + CPU + ネットワーク)
  # ==========================================
  synology:
    walk:
      - 1.3.6.1.2.1.1.3     # sysUpTime
      - 1.3.6.1.2.1.2.2     # ifTable
      - 1.3.6.1.2.1.31.1.1  # ifXTable
      - 1.3.6.1.2.1.25.2.3  # hrStorageTable (ストレージ使用量)
      - 1.3.6.1.2.1.25.3.3  # hrProcessorTable (CPU使用率)
    metrics:
      # システム稼働時間
      - name: sysUpTime
        oid: 1.3.6.1.2.1.1.3.0
        type: gauge
        help: System uptime in hundredths of a second

      # CPU 使用率 (%)
      - name: hrProcessorLoad
        oid: 1.3.6.1.2.1.25.3.3.1.2
        type: gauge
        help: Processor load percentage
        indexes:
          - labelname: hrProcessorIndex
            type: gauge

      # ストレージ 合計サイズ (アロケーションユニット単位)
      - name: hrStorageSize
        oid: 1.3.6.1.2.1.25.2.3.1.5
        type: gauge
        help: Total storage size in allocation units
        indexes:
          - labelname: hrStorageIndex
            type: gauge
        lookups:
          - labels: [hrStorageIndex]
            labelname: hrStorageDescr
            oid: 1.3.6.1.2.1.25.2.3.1.3
            type: DisplayString

      # ストレージ 使用量 (アロケーションユニット単位)
      - name: hrStorageUsed
        oid: 1.3.6.1.2.1.25.2.3.1.6
        type: gauge
        help: Used storage in allocation units
        indexes:
          - labelname: hrStorageIndex
            type: gauge
        lookups:
          - labels: [hrStorageIndex]
            labelname: hrStorageDescr
            oid: 1.3.6.1.2.1.25.2.3.1.3
            type: DisplayString

      # アロケーションユニット サイズ (bytes)
      # 実際のバイト数 = hrStorageUsed * hrStorageAllocationUnits
      - name: hrStorageAllocationUnits
        oid: 1.3.6.1.2.1.25.2.3.1.4
        type: gauge
        help: Size of allocation units in bytes
        indexes:
          - labelname: hrStorageIndex
            type: gauge
        lookups:
          - labels: [hrStorageIndex]
            labelname: hrStorageDescr
            oid: 1.3.6.1.2.1.25.2.3.1.3
            type: DisplayString

      # NAS ネットワーク 受信バイト数
      - name: ifHCInOctets
        oid: 1.3.6.1.2.1.31.1.1.1.6
        type: counter
        help: Incoming bytes on interface (64-bit counter)
        indexes:
          - labelname: ifIndex
            type: gauge
        lookups:
          - labels: [ifIndex]
            labelname: ifDescr
            oid: 1.3.6.1.2.1.2.2.1.2
            type: DisplayString

      # NAS ネットワーク 送信バイト数
      - name: ifHCOutOctets
        oid: 1.3.6.1.2.1.31.1.1.1.10
        type: counter
        help: Outgoing bytes on interface (64-bit counter)
        indexes:
          - labelname: ifIndex
            type: gauge
        lookups:
          - labels: [ifIndex]
            labelname: ifDescr
            oid: 1.3.6.1.2.1.2.2.1.2
            type: DisplayString
