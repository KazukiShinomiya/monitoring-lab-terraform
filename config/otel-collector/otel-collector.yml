# ==========================================
# OpenTelemetry Collector Configuration
# ==========================================
# OTLP トレースを受信して Grafana Tempo に転送するコレクター設定
# 配置先: /home/ubuntu/monitoring-lab/otel-collector/otel-collector.yml (bind mount)
# コンテナ内マウント先: /etc/otel-collector/otel-collector.yml

# ----- 受信者設定 -----
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: "0.0.0.0:4317"   # OTLP gRPC — 外部公開 (アプリからのトレース受信)
      http:
        endpoint: "0.0.0.0:4318"   # OTLP HTTP — Docker ネットワーク内のみ

# ----- プロセッサー設定 -----
processors:
  batch:
    timeout: 1s            # バッチ送信タイムアウト
    send_batch_size: 1024  # バッチサイズ上限 (パフォーマンス最適化)

# ----- エクスポーター設定 -----
exporters:
  otlp/tempo:
    endpoint: "tempo:4317"   # Docker ネットワーク内の Tempo コンテナ (gRPC)
    tls:
      insecure: true         # 学習環境: TLS なし (本番では証明書設定が必要)

  # MCP メトリクス用 (016-mcp-metrics-exporter)
  # OTLP で受けた MCP メトリクスを既存 VictoriaMetrics へ remote-write する。
  # VM は Prometheus の remote_write 先として既に稼働中 → 新規受信機構は不要。
  # collector からの outbound のため新規 publish ポートは増えない。
  prometheusremotewrite:
    endpoint: "http://victoriametrics:8428/api/v1/write"  # Docker ネットワーク内の VM
    tls:
      insecure: true
    resource_to_telemetry_conversion:
      enabled: true   # service.name 等の Resource 属性をラベル/target_info へ展開

# ----- サービス設定 -----
service:
  # トレースパイプライン: 受信 → バッチ処理 → Tempo へ転送
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/tempo]

    # メトリクスパイプライン (016): OTLP 受信 → バッチ → VictoriaMetrics へ remote-write
    # MCP サーバーが OTLP/gRPC(4317) で push したメトリクスをここで受ける。
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheusremotewrite]

  # Prometheus スクレイプ用テレメトリーエンドポイント (Constitution 原則 V)
  # Prometheus が otel-collector:8888 をスクレイプして自己監視する
  # v0.100+ では readers ベースの設定が必要 (address フィールドは廃止)
  telemetry:
    metrics:
      level: detailed
      readers:
        - pull:
            exporter:
              prometheus:
                host: "0.0.0.0"
                port: 8888
