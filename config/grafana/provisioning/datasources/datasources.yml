# ==========================================
# Grafana Datasource Provisioning
# ==========================================
# このファイルはGrafanaの起動時に自動的にデータソースを登録します。
# 配置先: grafana_provisioning ボリューム内の datasources/datasources.yml

apiVersion: 1

# 既存のデータソースを削除するか（上書き動作）
deleteDatasources:
  - name: Prometheus
    orgId: 1
  - name: Zabbix
    orgId: 1
  - name: Loki
    orgId: 1
  - name: Tempo
    orgId: 1
  - name: VictoriaMetrics
    orgId: 1
  - name: Pyroscope
    orgId: 1

datasources:
  # ==========================================
  # Prometheus データソース
  # ==========================================
  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy  # Grafanaサーバー経由でアクセス
    url: http://prometheus:9090  # Docker Network内のホスト名
    isDefault: true  # デフォルトのデータソースに設定
    editable: true   # UI上で編集可能
    version: 1
    jsonData:
      httpMethod: POST
      timeInterval: 15s  # スクレイプ間隔（Prometheusの設定と一致させる）
      queryTimeout: 60s
      # カスタムHTTPヘッダー（必要に応じて）
      # customQueryParameters: ''
      # Exemplar → Tempo トレースリンク (SC-003 対応)
      exemplarTraceIdDestinations:
        - name: traceID
          datasourceUid: tempo  # Tempo データソースの uid と一致させる

  # ==========================================
  # Zabbix データソース
  # ==========================================
  # 注意: Zabbixプラグインのインストールが必要
  # GF_INSTALL_PLUGINS=alexanderzobnin-zabbix-app
  - name: Zabbix
    type: alexanderzobnin-zabbix-datasource
    access: proxy
    url: http://zbx_web:8080/api_jsonrpc.php  # Zabbix API Endpoint
    editable: true
    version: 1
    jsonData:
      # Zabbix認証情報
      username: Admin  # Zabbixのユーザー名

      # パフォーマンス設定
      trends: true         # トレンドデータの使用
      trendsFrom: '7d'     # 7日以前はトレンドデータを使用
      trendsRange: '4d'    # 4日以上の範囲ではトレンドデータを使用
      cacheTTL: '60s'      # キャッシュ有効期間 ※duration形式で指定
      timeout: '30'        # タイムアウト（秒）※文字列で指定

      # ダイレクトDB接続（オプション・高速化）
      # dbConnectionEnable: true
      # dbConnectionDatasourceId: 2  # PostgreSQLデータソースのID

    # 機密情報（UI上で非表示）
    secureJsonData:
      # Grafana コンテナの環境変数 ZABBIX_PASSWORD から注入（平文をリポジトリに残さない）
      # 値は terraform/envs/local/grafana/terragrunt.hcl の env が .env から渡す（未設定時は dev 既定 "zabbix"）
      password: ${ZABBIX_PASSWORD}

  # ==========================================
  # Loki データソース
  # ==========================================
  # ログ集約サービス Loki への接続設定
  # プロビジョニングにより Grafana 起動時に自動追加される（FR-004）
  - name: Loki
    type: loki
    uid: loki
    access: proxy  # Grafanaサーバー経由でアクセス
    url: http://loki:3100  # Docker Network内のホスト名
    isDefault: false  # Prometheusがデフォルトを維持
    editable: true
    version: 1
    jsonData:
      maxLines: 1000  # Explore での最大表示行数

  # ==========================================
  # Grafana Tempo データソース
  # ==========================================
  # 分散トレーシングバックエンド Tempo への接続設定 (FR-003 対応)
  # uid: tempo — Prometheus の exemplarTraceIdDestinations から参照される
  - name: Tempo
    type: tempo
    uid: tempo
    access: proxy  # Grafanaサーバー経由でアクセス
    url: http://tempo:3200  # Docker Network内のホスト名 + HTTP API ポート
    isDefault: false
    editable: true
    version: 1
    jsonData:
      httpMethod: GET
      # サービスグラフ表示 — metrics_generator が生成したサービス間依存グラフ
      serviceMap:
        datasourceUid: prometheus  # Prometheus データソースの uid
      # ノードグラフ可視化 (サービスグラフ表示に必要)
      nodeGraph:
        enabled: true
      # トレース → ログ相関 (SC-003 対応: ウォーターフォールから Loki ログへジャンプ)
      tracesToLogs:
        datasourceUid: loki        # Loki データソースの uid
        filterByTraceID: true
        filterBySpanID: false
      # トレース → メトリクス相関 (Exemplar 逆引き)
      tracesToMetrics:
        datasourceUid: prometheus  # Prometheus データソースの uid
        spanStartTimeShift: '-5m'
        spanEndTimeShift: '5m'

  # ==========================================
  # VictoriaMetrics データソース（長期ストレージ）
  # ==========================================
  # Prometheus remote_write で蓄積された長期メトリクスデータへのアクセス
  # type: prometheus — VM は Prometheus 互換 API を提供（追加プラグイン不要）
  # uid: victoriametrics — 将来の Correlations 設定用
  - name: VictoriaMetrics
    type: prometheus
    uid: victoriametrics
    access: proxy
    url: http://victoriametrics:8428
    isDefault: false  # Prometheus がデフォルトを維持（SC-003）
    editable: true
    version: 1
    jsonData:
      httpMethod: POST
      timeInterval: 15s  # Prometheus と同じスクレイプ間隔
      queryTimeout: 60s

  # ==========================================
  # Grafana Pyroscope データソース（継続的プロファイリング）
  # ==========================================
  # LGTM+P スタックの P — CPU・メモリ・goroutine プロファイルを Explore で可視化 (FR-003)
  # uid: pyroscope — 将来の Prometheus Exemplar → Profile 相関リンク用 (US3)
  # type: grafana-pyroscope-datasource — Grafana 10+ 組み込み（追加プラグイン不要）
  - name: Pyroscope
    type: grafana-pyroscope-datasource
    uid: pyroscope
    access: proxy
    url: http://pyroscope:4040
    isDefault: false
    editable: true
    version: 1

  # ==========================================
  # PostgreSQL データソース（オプション）
  # ==========================================
  # Zabbixのデータベースに直接アクセスする場合に使用
  # - name: Zabbix-PostgreSQL
  #   type: postgres
  #   access: proxy
  #   url: postgres:5432
  #   database: zabbix
  #   user: zabbix
  #   editable: true
  #   secureJsonData:
  #     password: YOUR_POSTGRES_PASSWORD
  #   jsonData:
  #     sslmode: disable
  #     postgresVersion: 1500  # PostgreSQL 15.x
  #     timescaledb: false

# ==========================================
# 設定適用方法
# ==========================================
# 1. Grafanaコンテナが起動している状態で:
#    docker cp datasources.yml monitoring-lab-grafana:/etc/grafana/provisioning/datasources/
#
# 2. Grafanaを再起動:
#    docker restart monitoring-lab-grafana
#
# 3. または、初回デプロイ時にボリュームに配置:
#    - grafana_provisioning ボリュームをマウント
#    - このファイルを datasources/ ディレクトリに配置
#
# 確認方法:
# - Grafana UI → Configuration → Data Sources
# - Prometheus と Zabbix が自動登録されていることを確認
