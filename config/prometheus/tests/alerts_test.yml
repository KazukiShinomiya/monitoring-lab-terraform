# ==========================================
# アラートルールのユニットテスト（promtool test rules）
# ==========================================
# 実行:
#   docker exec -i monitoring-lab-prometheus promtool test rules <このファイル>
#   （scripts/test-alert-rules.sh がリモートの prometheus コンテナへ流し込む）
#
# 目的: 「state=inactive で health=ok」はルールが正しいことを意味しない。
# 式が常に空を返していても inactive になるため、合成データを与えて
# 「鳴るべきときに鳴り、鳴るべきでないときに鳴らない」ことを確かめる。
#
# 2026-07-20 のインシデント（CI ランナーが8日間死んでいたのに誰も気づかなかった）を
# 受けて追加したルール群を対象にしている。

rule_files:
  - ../alerts.yml

evaluation_interval: 1m

tests:
  # ------------------------------------------------------------
  # ランナーが再起動ループしたら critical で鳴ること
  # ------------------------------------------------------------
  # container_start_time_seconds は「コンテナの起動時刻」。再起動のたびに値が変わるので
  # changes() で回数を数えられる。実故障は約62秒周期だったため、毎分値が変わる系列で再現する。
  - interval: 1m
    input_series:
      - series: 'container_start_time_seconds{name="monitoring-lab-github-runner"}'
        values: "1+1x25"

    alert_rule_test:
      - eval_time: 25m
        alertname: GitHubRunnerRestartLoop
        exp_alerts:
          - exp_labels:
              severity: critical
              name: monitoring-lab-github-runner
            exp_annotations:
              summary: "CI ランナーが再起動ループしている"
              description: >-
                monitoring-lab-github-runner が15分間に 14 回再起動しています。
                self-hosted ラベル待ちの CI ジョブが queued のまま消化されなくなります。
                docker logs monitoring-lab-github-runner で登録エラーを確認してください。

      # 汎用ルールは github-runner を除外しているので、同じ入力でも鳴ってはならない。
      # 除外ラベルの書き損じは静かに二重通知を生むため明示的に検証する。
      - eval_time: 25m
        alertname: ContainerRestartLoop
        exp_alerts: []

  # ------------------------------------------------------------
  # 安定稼働中は鳴らないこと（誤検知の防止）
  # ------------------------------------------------------------
  # 起動時刻が一定＝再起動していない状態。ここで鳴るようなら閾値設計が誤っている。
  - interval: 1m
    input_series:
      - series: 'container_start_time_seconds{name="monitoring-lab-github-runner"}'
        values: "1000x25"

    alert_rule_test:
      - eval_time: 25m
        alertname: GitHubRunnerRestartLoop
        exp_alerts: []
      - eval_time: 25m
        alertname: GitHubRunnerAbsent
        exp_alerts: []

  # ------------------------------------------------------------
  # apply によるコンテナ再作成では鳴らないこと
  # ------------------------------------------------------------
  # 実測で再作成は1〜2秒、15分窓での変化は1回程度。閾値4回はこれを跨がない水準に置いた。
  # ここが鳴ると apply のたびに誤報が出て、アラートが信用されなくなる。
  - interval: 1m
    input_series:
      - series: 'container_start_time_seconds{name="monitoring-lab-github-runner"}'
        values: "1000x10 2000x15"

    alert_rule_test:
      - eval_time: 25m
        alertname: GitHubRunnerRestartLoop
        exp_alerts: []

  # ------------------------------------------------------------
  # コンテナが消えたら critical で鳴ること
  # ------------------------------------------------------------
  # 入力系列を一切与えない＝メトリクスが存在しない状態を absent() が捉える。
  - interval: 1m
    input_series: []

    alert_rule_test:
      - eval_time: 15m
        alertname: GitHubRunnerAbsent
        exp_alerts:
          - exp_labels:
              severity: critical
              name: monitoring-lab-github-runner
            exp_annotations:
              summary: "CI ランナーのコンテナが存在しない"
              description: >-
                monitoring-lab-github-runner のメトリクスが10分以上取得できません。
                コンテナ停止・削除、または cAdvisor 側の異常が疑われます。
                ランナーが不在だと CI の Terraform Apply は無期限に queued のまま滞留します。

  # ------------------------------------------------------------
  # ランナー以外のコンテナも汎用ルールで拾えること
  # ------------------------------------------------------------
  - interval: 1m
    input_series:
      - series: 'container_start_time_seconds{name="monitoring-lab-grafana"}'
        values: "1+1x25"

    alert_rule_test:
      - eval_time: 25m
        alertname: ContainerRestartLoop
        exp_alerts:
          - exp_labels:
              severity: warning
              name: monitoring-lab-grafana
            exp_annotations:
              summary: "コンテナが再起動ループしている: monitoring-lab-grafana"
              description: "monitoring-lab-grafana が15分間に 14 回再起動しています。"

  # ------------------------------------------------------------
  # マウントポイントが消えたら critical で鳴ること
  # ------------------------------------------------------------
  # 2026-06-24 の実故障の再現: 90分間マウントされていた /mnt/ssd_2 が消える。
  # node_exporter 自体は生きている（ホストは動いていた）。
  - interval: 1m
    input_series:
      - series: 'node_filesystem_size_bytes{instance="10.0.0.254:9100", device="/dev/sdd1", mountpoint="/mnt/ssd_2"}'
        values: "128000000000x90 _x30"
      - series: 'up{instance="10.0.0.254:9100", job="node_exporter"}'
        values: "1x120"

    alert_rule_test:
      # 消えた直後はまだ鳴らない（for: 10m の猶予）
      - eval_time: 95m
        alertname: FilesystemMountDisappeared
        exp_alerts: []
      # 10分を超えたら鳴る
      - eval_time: 105m
        alertname: FilesystemMountDisappeared
        exp_alerts:
          - exp_labels:
              severity: critical
              instance: 10.0.0.254:9100
              mountpoint: /mnt/ssd_2
            exp_annotations:
              summary: "マウントポイントが消失: /mnt/ssd_2"
              description: >-
                10.0.0.254:9100 の /mnt/ssd_2 が1時間前は存在したのに消えています。USB
                リンク崩壊・ディスク脱落・意図しないアンマウントの可能性があります。dmesg
                で 'USB disconnect' / 'Device offlined' を確認してください。

  # ------------------------------------------------------------
  # デバイスノードが入れ替わっただけでは鳴らないこと
  # ------------------------------------------------------------
  # 2026-07-12 の復旧で実際に sdc1 と sdd1 が入れ替わった。device ラベルを
  # 含めて突合する実装だと、マウントは健全なのに誤発火する。この回帰を防ぐ。
  - interval: 1m
    input_series:
      - series: 'node_filesystem_size_bytes{instance="10.0.0.254:9100", device="/dev/sdd1", mountpoint="/mnt/ssd_2"}'
        values: "128000000000x90 _x30"
      - series: 'node_filesystem_size_bytes{instance="10.0.0.254:9100", device="/dev/sdc1", mountpoint="/mnt/ssd_2"}'
        values: "_x90 128000000000x30"
      - series: 'up{instance="10.0.0.254:9100", job="node_exporter"}'
        values: "1x120"

    alert_rule_test:
      - eval_time: 105m
        alertname: FilesystemMountDisappeared
        exp_alerts: []

  # ------------------------------------------------------------
  # exporter 自体が落ちている場合は鳴らないこと（TargetDown の担当）
  # ------------------------------------------------------------
  # 番犬が二重に鳴くと、どちらの信号も信用されなくなる。
  - interval: 1m
    input_series:
      - series: 'node_filesystem_size_bytes{instance="10.0.0.254:9100", device="/dev/sdd1", mountpoint="/mnt/ssd_2"}'
        values: "128000000000x90 _x30"
      - series: 'up{instance="10.0.0.254:9100", job="node_exporter"}'
        values: "1x90 0x30"

    alert_rule_test:
      - eval_time: 105m
        alertname: FilesystemMountDisappeared
        exp_alerts: []
