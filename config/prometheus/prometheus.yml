# ==========================================
# Prometheus Configuration
# ==========================================
# このファイルはPrometheusのメトリクス収集設定です。
# 配置先: /etc/prometheus/prometheus.yml (bind mount)

# ----- グローバル設定 -----
global:
  # スクレイプ間隔（デフォルト）
  scrape_interval: 15s

  # スクレイプタイムアウト
  scrape_timeout: 10s

  # ルール評価間隔
  evaluation_interval: 15s

  # 外部システムとの通信時に付与されるラベル
  external_labels:
    cluster: 'monitoring-lab'
    environment: 'local'

  # Exemplar 収集に必要 — OpenMetrics フォーマットを優先してスクレイプ
  # Prometheus クライアントが Exemplar を付与している場合に収集される
  scrape_protocols:
    - OpenMetricsText1.0.0
    - OpenMetricsText0.0.1
    - PrometheusText0.0.4

# ----- 長期ストレージへの転送設定 -----
# VictoriaMetrics に全メトリクスを remote_write で転送（FR-001）
# VM 停止中も Prometheus の通常動作は継続する（FR-007）
remote_write:
  - url: "http://victoriametrics:8428/api/v1/write"
    queue_config:
      min_backoff: 30ms
      max_backoff: 60s
      max_shards: 4

# ----- ルールファイルの読み込み -----
rule_files:
  - '/etc/prometheus/alerts.yml'
  - '/etc/prometheus/slo-rules.yml'

# ----- Alertmanager 連携設定 -----
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# ----- スクレイプ設定 -----
scrape_configs:
  # ==========================================
  # Job 1: Prometheus自身の監視
  # ==========================================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ==========================================
  # Job 2: cAdvisor（Dockerコンテナメトリクス）
  # ==========================================
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'docker-host'

  # ==========================================
  # Job 3: SNMP - RTX830 ルーター
  # ==========================================
  # SNMP Exporter経由でYamaha RTX830のインターフェーストラフィックを収集
  # モジュール if_mib: WAN/LAN 送受信バイト数・リンク状態
  - job_name: 'snmp_rtx830'
    static_configs:
      - targets: ['10.0.0.1']
        labels:
          device_type: router
          device_name: rtx830
          device_vendor: yamaha
    metrics_path: /snmp
    params:
      module: [if_mib]
      auth: [monlab_v1]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: snmp-exporter:9116
    # SNMP は応答が遅い場合があるため、タイムアウトを長めに設定
    scrape_timeout: 30s
    scrape_interval: 60s

  # ==========================================
  # Job 4: SNMP - Synology NAS
  # ==========================================
  # SNMP Exporter経由でSynology NASのストレージ・CPU・ネットワークを収集
  # モジュール synology: CPU使用率・ストレージ使用量・ネットワークトラフィック
  - job_name: 'snmp_synology'
    static_configs:
      - targets: ['10.0.0.200']
        labels:
          device_type: nas
          device_name: synology
    metrics_path: /snmp
    params:
      module: [synology]
      auth: [monlab_v2]
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: snmp-exporter:9116
    scrape_timeout: 30s
    scrape_interval: 60s

  # ==========================================
  # Job 5: Node Exporter（Linuxホストメトリクス）
  # ==========================================
  # 各Linuxマシンに直接インストールしたNode Exporterからメトリクス収集
  # CPU・メモリ・ディスク・ネットワーク等のホストレベルメトリクス
  - job_name: 'node_exporter'
    scrape_interval: 15s
    static_configs:
      - targets:
          - '10.0.0.250:9100'
          - '10.0.0.254:9100'
        labels:
          env: 'local'

  # ==========================================
  # Job 6: Tekken Bot（バトル統計）
  # ==========================================
  # 10.0.0.254 上の exporter.py が battles.db を集計して公開
  # レーティング推移・勝率・対面別成績などゲーム統計メトリクス
  - job_name: 'tekken_bot'
    scrape_interval: 30s
    static_configs:
      - targets: ['10.0.0.254:9877']
        labels:
          instance: 'tekken-bot'

  # ==========================================
  # Job 7: Alertmanager（自己監視 SC-004）
  # ==========================================
  # Alertmanager 自身のメトリクスを収集
  # 既存の TargetDown アラートが Alertmanager ダウンを検知する
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']

  # ==========================================
  # Job 8: Loki（自己監視 FR-009）
  # ==========================================
  # Loki 自身のメトリクスを収集（取り込みレート・クエリレイテンシ・ストレージ使用量）
  # 既存の TargetDown アラートが Loki ダウンを検知する
  - job_name: 'loki'
    static_configs:
      - targets: ['loki:3100']

  # ==========================================
  # Job 9: Grafana Tempo（自己監視）
  # ==========================================
  # Tempo 自身のメトリクスを収集（取り込みレート・クエリレイテンシ・ブロック数等）
  # 既存の TargetDown アラートが Tempo ダウンを検知する
  - job_name: 'tempo'
    static_configs:
      - targets: ['tempo:3200']

  # ==========================================
  # Job 10: OTel Collector（自己監視 — Constitution 原則 V）
  # ==========================================
  # OTel Collector 自身のメトリクスを収集（受信スパン数・エクスポート失敗数等）
  # 既存の TargetDown アラートが OTel Collector ダウンを検知する
  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8888']

  # ==========================================
  # Job 11: VictoriaMetrics（自己監視 — Constitution 原則 V）
  # ==========================================
  # VictoriaMetrics 自身のメトリクスを収集（取り込み行数・エラー数・キャッシュ使用量等）
  # 既存の TargetDown アラートが VictoriaMetrics ダウンを検知する
  - job_name: 'victoriametrics'
    static_configs:
      - targets: ['victoriametrics:8428']

  # ==========================================
  # Job 12: Grafana Pyroscope（自己監視 — FR-005 / Constitution 原則 V）
  # ==========================================
  # Pyroscope 自身のメトリクスを収集（受信プロファイル数・取り込みレート等）
  # pyroscope_distributor_received_profiles_total の増加で動作確認 (SC-002)
  # 既存の TargetDown アラートが Pyroscope ダウンを自動検知する
  - job_name: 'pyroscope'
    static_configs:
      - targets: ['pyroscope:4040']
