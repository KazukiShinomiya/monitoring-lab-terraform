# ==========================================
# Prometheus Configuration
# ==========================================
# このファイルはPrometheusのメトリクス収集設定です。
# 配置先: /etc/prometheus/prometheus.yml (bind mount)

# ----- グローバル設定 -----
global:
  # スクレイプ間隔（デフォルト）
  scrape_interval: 15s

  # スクレイプタイムアウト
  scrape_timeout: 10s

  # ルール評価間隔
  evaluation_interval: 15s

  # 外部システムとの通信時に付与されるラベル
  external_labels:
    cluster: 'monitoring-lab'
    environment: 'local'

# ----- ルールファイルの読み込み -----
rule_files:
  - '/etc/prometheus/alerts.yml'

# ----- スクレイプ設定 -----
scrape_configs:
  # ==========================================
  # Job 1: Prometheus自身の監視
  # ==========================================
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ==========================================
  # Job 2: cAdvisor（Dockerコンテナメトリクス）
  # ==========================================
  - job_name: 'cadvisor'
    static_configs:
      - targets: ['cadvisor:8080']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
        replacement: 'docker-host'
