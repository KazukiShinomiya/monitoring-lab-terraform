# ==========================================
# Prometheus Alert Rules
# ==========================================
# 配置先: /etc/prometheus/alerts.yml (bind mount)
#
# 注意: このリモートサーバーのcAdvisorでは、コンテナメトリクスに
# `name` ラベルがなく、`id` ラベルにcgroupパスが入る。
# 例: id="/system.slice/docker-<container_id>.scope"

groups:
  # ==========================================
  # グループ1: スクレイプターゲットの稼働状態
  # ==========================================
  - name: target_health
    rules:
      # スクレイプターゲットダウン
      - alert: TargetDown
        expr: up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "スクレイプターゲットダウン: {{ $labels.job }}"
          description: "Prometheusがターゲット {{ $labels.instance }} (job: {{ $labels.job }}) からメトリクスを取得できません。"

  # ==========================================
  # グループ1.5: 通知経路の自己監視（メタ監視）
  # ==========================================
  # 背景: 2026-07 監視盲目インシデント（TargetDown critical が約1ヶ月誰にも
  # 気づかれず発火し続けた）の再発防止。「アラートが鳴っている」ことと
  # 「人に届いている」ことは別物として監視する。
  - name: alerting_pipeline_health
    rules:
      # 死活証明（dead man's switch）: 常時発火し続けることが正常。
      # Alertmanager API にこのアラートが「居ない」= Prometheus のルール評価
      # または AM への送出経路が死んでいる。/drift-check 層4 や外部から確認する。
      - alert: Watchdog
        expr: vector(1)
        labels:
          severity: none
        annotations:
          summary: "Alerting pipeline 死活証明（常時発火が正常）"
          description: "このアラートは常に発火します。Alertmanager にこれが存在しない場合、Prometheus→Alertmanager の経路が壊れています。"

      # critical の長期放置を別名で再エスカレーション。
      # 3日以上継続する critical は「対応漏れ」か「監視の綻び」——どちらも人の目が要る。
      # 注: Prometheus が1時間以上停止すると for のカウントはリセットされる（許容）。
      - alert: CriticalAlertUnattended
        expr: ALERTS{alertstate="firing", severity="critical", alertname!="CriticalAlertUnattended"} == 1
        for: 72h
        labels:
          severity: critical
        annotations:
          summary: "critical アラートが3日以上放置: {{ $labels.alertname }}"
          description: "{{ $labels.alertname }} (instance: {{ $labels.instance }}) が72時間以上発火し続けています。対応するか、意図的な放置なら silence を設定してください。"

      # Slack 通知の送信失敗（webhook 失効・ネットワーク断など）
      - alert: AlertmanagerNotificationFailed
        expr: increase(alertmanager_notifications_failed_total[15m]) > 0
        labels:
          severity: warning
        annotations:
          summary: "Alertmanager 通知送信失敗 ({{ $labels.integration }})"
          description: "直近15分で {{ $labels.integration }} への通知送信が {{ $value | printf \"%.0f\" }} 件失敗しています。webhook URL の失効や到達性を確認してください。"

  # ==========================================
  # グループ2: コンテナリソース使用率
  # ==========================================
  - name: container_resources
    rules:
      # コンテナCPU高負荷（5分間平均）
      #
      # 2026-07-20: id=~"/system.slice/docker-.+" から name ベースへ変更。
      # cAdvisor が containerd ソケット未マウントで docker factory 登録に失敗しており、
      # name ラベルが一切付かなかったため id で代用していた（通知にハッシュしか出ず読めない）。
      # マウント追加で name が復活したので、人間が読めるラベルへ戻す。
      - alert: ContainerHighCPU
        expr: rate(container_cpu_usage_seconds_total{name=~"monitoring-lab-.+"}[5m]) * 100 > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CPU高負荷: {{ $labels.name }}"
          description: "コンテナ {{ $labels.name }} のCPU使用率が5分間 {{ $value | printf \"%.1f\" }}% を超えています。"

      # コンテナメモリ高使用率
      - alert: ContainerHighMemory
        expr: |
          (container_memory_usage_bytes{name=~"monitoring-lab-.+"} /
           container_spec_memory_limit_bytes{name=~"monitoring-lab-.+"}) * 100 > 80
            and container_spec_memory_limit_bytes{name=~"monitoring-lab-.+"} > 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "メモリ高使用: {{ $labels.name }}"
          description: "コンテナ {{ $labels.name }} のメモリ使用率が {{ $value | printf \"%.1f\" }}% です。"

  # ==========================================
  # グループ2-B: CI ランナー健全性
  # ==========================================
  # 2026-07-20 追加。self-hosted ランナーが "already configured" 起動ループで 8 日間死に、
  # その間 CI の Terraform Apply が queued のまま溜まっていたのに誰も気づかなかった。
  # 故障そのものは entrypoint 修正（9d190c3）で根絶したが、別の理由で落ちたときに
  # 気づけない穴は塞げていなかったため、検知をここで用意する。
  - name: ci_runner_health
    rules:
      # ランナーの再起動ループ
      #
      # 実故障は約62秒周期＝15分で約14回。閾値4回は十分な余裕を持って捕まえつつ、
      # apply によるコンテナ再作成（数分内に1〜2回）では鳴らない水準。
      - alert: GitHubRunnerRestartLoop
        expr: changes(container_start_time_seconds{name="monitoring-lab-github-runner"}[15m]) > 3
        for: 5m
        labels:
          severity: critical
        annotations:
          summary: "CI ランナーが再起動ループしている"
          description: >-
            monitoring-lab-github-runner が15分間に {{ $value }} 回再起動しています。
            self-hosted ラベル待ちの CI ジョブが queued のまま消化されなくなります。
            docker logs monitoring-lab-github-runner で登録エラーを確認してください。

      # ランナーコンテナの消失
      #
      # for: 10m は apply による再作成（実測1〜2秒）を確実に見逃すための猶予。
      - alert: GitHubRunnerAbsent
        expr: absent(container_start_time_seconds{name="monitoring-lab-github-runner"})
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "CI ランナーのコンテナが存在しない"
          description: >-
            monitoring-lab-github-runner のメトリクスが10分以上取得できません。
            コンテナ停止・削除、または cAdvisor 側の異常が疑われます。
            ランナーが不在だと CI の Terraform Apply は無期限に queued のまま滞留します。

      # 汎用: コンテナ全般の再起動ループ
      #
      # ランナー以外の同種の故障も拾う。newrelic は再起動ループが既知の問題として
      # ドキュメントされているが、2026-07-20 時点では実際にはループしていないため
      # 除外していない。恒常的にノイズを出すようなら除外を検討する
      # （鳴りっぱなしのアラートは gitleaks と同じく番犬として機能しなくなる）。
      - alert: ContainerRestartLoop
        expr: |
          changes(container_start_time_seconds{name=~"monitoring-lab-.+",
                                               name!="monitoring-lab-github-runner"}[15m]) > 3
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "コンテナが再起動ループしている: {{ $labels.name }}"
          description: "{{ $labels.name }} が15分間に {{ $value }} 回再起動しています。"

  # ==========================================
  # グループ3: Prometheus自己監視
  # ==========================================
  - name: prometheus_health
    rules:
      # Prometheusの設定リロード失敗
      - alert: PrometheusConfigReloadFailed
        expr: prometheus_config_last_reload_successful == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Prometheus設定リロード失敗"
          description: "Prometheusの設定ファイルのリロードが失敗しました。設定を確認してください。"

      # TSDBコンパクションの失敗
      - alert: PrometheusTSDBCompactionsFailed
        expr: increase(prometheus_tsdb_compactions_failed_total[3h]) > 0
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "TSDB圧縮失敗"
          description: "PrometheusのTSDB圧縮が失敗しました。ディスク容量を確認してください。"

  # ==========================================
  # グループ3.5: WOWHoneypot データ鮮度
  # ==========================================
  # 背景: 2026-07-07 に VPS 再起動でハニーポットが停止したが、exporter は
  # 生存（up=1）・カウンタ累計も見えるため誰も気づかず5日間データが止まった。
  # 「exporter が生きている」ことと「データが流れている」ことは別物として監視する。
  # 経路: VPS honeypot → (cron rsync 10分毎) → wow-exporter → Prometheus
  - name: wow_honeypot_freshness
    rules:
      # HTTP ハニーポットへのトラフィック途絶。インターネット背景ノイズにより
      # 通常 数十req/h（実測 10〜45/h）が常時届くため、3時間ゼロは経路のどこか
      # （honeypot 停止・rsync 断・exporter 停滞）が死んでいる。検知遅延は窓+for で約3.5時間。
      # 注: exporter 再起動時はログ全再読込でカウンタが急伸するため誤発火しない。
      - alert: WowHoneypotTrafficSilent
        expr: sum(rate(wowhoneypot_http_requests_total{protocol="http"}[3h])) == 0
        for: 30m
        labels:
          severity: critical
        annotations:
          summary: "WOWHoneypot トラフィック途絶（3時間以上ゼロ）"
          description: "HTTP ハニーポットの新規リクエストが3時間以上観測されていません。VPS の honeypot サービス停止・rsync 断・exporter 停滞のいずれかを疑ってください（2026-07 の5日間盲目の再発防止）。"

      # protocol 別の系列消失ガード。2026-07 の非対称永続化バグ（exporter 再起動で
      # HTTPS 系列が消える）の回帰検知。http が消えると上の TrafficSilent は
      # 空ベクトルとなり発火できないため、absent 監視で盲点を塞ぐ。
      # for 30m は再起動時のログ全再読込（https 優先処理）の猶予。
      - alert: WowHoneypotHttpSeriesAbsent
        expr: absent(wowhoneypot_http_requests_total{protocol="http"})
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "WOWHoneypot http 系列が消失"
          description: "wowhoneypot_http_requests_total{protocol=\"http\"} が30分以上存在しません。exporter の再起動失敗またはログ再集計の異常を疑ってください。"

      - alert: WowHoneypotHttpsSeriesAbsent
        expr: absent(wowhoneypot_http_requests_total{protocol="https"})
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "WOWHoneypot https 系列が消失"
          description: "wowhoneypot_http_requests_total{protocol=\"https\"} が30分以上存在しません。非対称永続化バグ（2026-07 修正済み）の回帰の可能性があります。"

      # exporter の処理ループ停滞。ループは300秒間隔で last_sync_timestamp を
      # 更新するため、30分（6周期）更新が無ければ例外ループやハングを疑う。
      # /metrics 応答自体は生きている（up=1）ケースを拾う。
      - alert: WowExporterLoopStuck
        expr: time() - wowhoneypot_last_sync_timestamp > 1800
        labels:
          severity: warning
        annotations:
          summary: "wow-exporter 処理ループ停滞"
          description: "wow-exporter の集計ループが30分以上完走していません（正常は5分間隔）。コンテナログで例外を確認してください。"

  # ==========================================
  # グループ4: 物理機器監視（RTX830 + Synology NAS）
  # ==========================================
  # 注意: デバイス到達不能は既存の TargetDown (グループ1) がカバー済み。
  # このグループはデバイスが応答している前提で、機器固有の状態を監視する。
  - name: physical_devices
    rules:
      # RTX830 LANインターフェースの運用停止
      # WAN1 (pp1/PPPoE) は通常 Down のため除外し、LAN[0-9]+ のみ対象
      - alert: RTX830LANInterfaceDown
        expr: ifOperStatus{job="snmp_rtx830", ifDescr=~"LAN[0-9]+.*"} == 2
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "RTX830 LANポートダウン: {{ $labels.ifDescr }}"
          description: "RTX830のインターフェース {{ $labels.ifDescr }} が運用停止 (ifOperStatus=2) 状態です。2分以上継続しています。"

      # Synology NAS CPU高負荷
      - alert: SynologyHighCPU
        expr: hrProcessorLoad{job="snmp_synology"} > 80
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Synology NAS CPU高負荷"
          description: "Synology NASのCPU使用率が {{ $value }}% に達しています（5分間継続）。"

      # Synology NAS ディスク使用率高
      # hrStorageDescr が "Volume" を含むエントリのみ対象（RAM・スワップを除外）
      - alert: SynologyDiskHighUsage
        expr: |
          (hrStorageUsed{job="snmp_synology", hrStorageDescr=~".*[Vv]olume.*"} /
           hrStorageSize{job="snmp_synology", hrStorageDescr=~".*[Vv]olume.*"}) * 100 > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Synology NAS ディスク残量不足: {{ $labels.hrStorageDescr }}"
          description: "ボリューム {{ $labels.hrStorageDescr }} の使用率が {{ $value | printf \"%.1f\" }}% です。"

      # NAS 外付けドライブ 読み取り専用（USB切断/EXT4ジャーナルアボート）
      # EXT4がジャーナルをアボートするとマウントポイントが read-only に落ちる。
      # /mnt/ 配下を対象とし、NAS本体の rootfs は除外する。
      - alert: NASFilesystemReadOnly
        expr: node_filesystem_readonly{instance="YOUR_LINUX_HOST_2:9100", mountpoint=~"/mnt/.+"} == 1
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "NAS 外付けドライブが読み取り専用: {{ $labels.mountpoint }}"
          description: "{{ $labels.mountpoint }} が read-only 状態です。USB 切断またはディスクエラーの可能性があります。"

      # NAS 外付けドライブ ディスク使用率高
      - alert: NASExternalDiskHighUsage
        expr: |
          (1 - node_filesystem_avail_bytes{instance="YOUR_LINUX_HOST_2:9100", mountpoint=~"/mnt/.+"}
             / node_filesystem_size_bytes{instance="YOUR_LINUX_HOST_2:9100", mountpoint=~"/mnt/.+"}) * 100 > 85
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "NAS 外付けドライブ残量不足: {{ $labels.mountpoint }}"
          description: "{{ $labels.mountpoint }} の使用率が {{ $value | printf \"%.1f\" }}% です。"

      # マウントポイントの消失（USB リンク崩壊・ディスク脱落）
      #
      # 2026-06-24 のインシデント対策。imageserver(RasPi4) で USB ハブごとリンクが
      # 崩壊し、/mnt/ssd_1 と /mnt/ssd_2 が systemd にアンマウントされた
      # （Device offlined - not ready after error recovery → 再起動まで復帰不能）。
      # 結果 antipiracy-crawler が停止したが、**約3週間誰も気づかなかった**。
      # 既存の NASFilesystemReadOnly は read-only 化しか見ておらず、
      # マウントポイントが「消える」ケースは素通りする。
      #
      # 設計:
      # - 「1時間前に在ったマウントポイントが今は無い」で判定する。監視対象を
      #   ハードコードしないため、新しいディスクを足しても追従不要
      # - **by (instance, mountpoint) で device ラベルを落とすのが肝**。今回の復旧で
      #   実際に sdc1 と sdd1 が入れ替わっており、device を含めて突合すると
      #   ノードの入れ替わりだけで誤発火する
      # - `up == 1` を条件に加え、exporter 自体が落ちている場合は鳴らさない
      #   （それは TargetDown の担当。二重に鳴らせば両方の信頼が落ちる）
      # - 意図的なアンマウント後は1時間で自然に収まる
      - alert: FilesystemMountDisappeared
        expr: |
          (
            max by (instance, mountpoint) (
              node_filesystem_size_bytes{mountpoint=~"/mnt/.+"} offset 1h
            )
            unless on (instance, mountpoint)
            max by (instance, mountpoint) (
              node_filesystem_size_bytes{mountpoint=~"/mnt/.+"}
            )
          )
          and on (instance) (up{job="node_exporter"} == 1)
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: "マウントポイントが消失: {{ $labels.mountpoint }}"
          description: "{{ $labels.instance }} の {{ $labels.mountpoint }} が1時間前は存在したのに消えています。USB リンク崩壊・ディスク脱落・意図しないアンマウントの可能性があります。dmesg で 'USB disconnect' / 'Device offlined' を確認してください。"

      # NAS 高 I/O ウェイト（ディスク障害の前兆）
      - alert: NASHighIOWait
        expr: rate(node_cpu_seconds_total{instance="YOUR_LINUX_HOST_2:9100", mode="iowait"}[5m]) * 100 > 30
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "NAS I/O ウェイト高騰"
          description: "YOUR_LINUX_HOST_2 の I/O ウェイトが {{ $value | printf \"%.1f\" }}% です。ディスク障害の前兆の可能性があります。"
