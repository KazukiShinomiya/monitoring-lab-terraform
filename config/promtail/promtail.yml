# ==========================================
# Promtail Configuration
# ==========================================
# ログ収集エージェント Promtail の設定ファイル
# 収集方式: Docker Socket 経由（docker_sd_configs）
# 配置先: /etc/promtail/promtail.yml (bind mount)

server:
  http_listen_port: 9080   # Prometheus メトリクス公開ポート
  grpc_listen_port: 0

# 読み取り済みログ位置の記録ファイル（Docker Volume で永続化済み）
positions:
  filename: /tmp/positions.yaml

# Loki へのプッシュ先
clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # ==========================================
  # Docker Socket 経由のコンテナログ収集
  # ==========================================
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s  # コンテナ一覧の更新間隔
        filters:
          - name: status
            values: ["running"]  # 稼働中コンテナのみ対象
    relabel_configs:
      # コンテナ名をラベルとして付与（先頭の "/" を除去）
      - source_labels: ['__meta_docker_container_name']
        regex: '/(.*)'
        target_label: container

      # ログストリーム種別（stdout/stderr）をラベルとして付与
      - source_labels: ['__meta_docker_container_log_stream']
        target_label: logstream

      # Docker イメージ名をラベルとして付与
      - source_labels: ['__meta_docker_container_image_name']
        target_label: image

    # Docker ログ JSON のタイムスタンプ・本文を抽出
    pipeline_stages:
      - docker: {}
