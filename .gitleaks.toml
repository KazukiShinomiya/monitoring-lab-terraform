# gitleaks 設定
#
# 既定ルールセットを継承した上で、既知の偽陽性のみを除外する。
# 定期スキャン(schedule)は全履歴を舐めるため、過去コミットに残るダミー値が
# 毎週 failure を生んでいた。赤が常態化すると本物の漏洩を見逃すので個別に潰す。
#
# 方針: fingerprint (.gitleaksignore) は commit SHA を含み、履歴書き換えで
# 全て無効化される (2026-07-19 の filter-repo で実際に発生)。よって SHA 非依存の
# パス/正規表現ベースで許可する。
#
# 追加時のルール: 「なぜ秘密でないか」を必ずコメントで残すこと。

[extend]
useDefault = true

[allowlist]
description = "既知の偽陽性 (ダミー値・プレースホルダ・公開既定値)"

paths = [
  # WOWHoneypot の攻撃検知ルール定義。攻撃者に返す偽レスポンス本体として
  # ダミーの api_key / aws_secret 等を意図的に含む。性質上ここは秘密の見本市になる。
  '''config/wow-exporter/mrrules_local\.xml''',
]

regexes = [
  # Slack Incoming Webhook のドキュメント上のプレースホルダ (T00000000/B00000000/X...)
  '''hooks\.slack\.com/services/T0{8}/B0{8}/X+''',

  # Grafana の初期既定資格情報。公開情報であり秘密ではない。
  '''curl -u admin:admin''',

  # SwitchBot API のドキュメント例。値は YOUR_TOKEN のままのプレースホルダ。
  '''Authorization: YOUR_TOKEN''',
]
