# ==========================================
# Taskfile.yml — monitoring-lab タスクランナー
# ==========================================
# 使い方:
#   task                   # タスク一覧表示
#   task start             # WSL2 Docker + 開発コンテナ起動
#   task sync:prometheus   # Prometheus 設定同期
#   task tg:plan           # terragrunt run --all plan
#
# インストール: https://taskfile.dev/installation/
#   Windows: winget install Task.Task
#   WSL2:    sh -c "$(curl --location https://taskfile.dev/install.sh)" -- -d -b ~/.local/bin

version: '3'

vars:
  WSL_DISTRO: Ubuntu-24.04
  REMOTE_HOST: YOUR_SERVER_IP
  REMOTE_USER: ubuntu
  SYNC_SCRIPT: ./scripts/sync-config.sh

# WSL2 経由でコマンドを実行するラッパー
# Windows の task から WSL2 コマンドを実行するために使用
env:
  COMPOSE_FILE: docker-compose.yml

tasks:

  # ========== 開発環境管理 ==========

  start:
    desc: "WSL2 Docker 起動 + 開発コンテナ起動"
    cmds:
      - wsl -d {{.WSL_DISTRO}} -e bash -c "sudo service docker start"
      - wsl -d {{.WSL_DISTRO}} -e bash -c "cd /mnt/e/work/labo && docker compose up -d"
    silent: false

  stop:
    desc: "開発コンテナ停止"
    cmds:
      - wsl -d {{.WSL_DISTRO}} -e bash -c "cd /mnt/e/work/labo && docker compose stop"

  status:
    desc: "リモートサーバーのコンテナ状態確認"
    cmds:
      - wsl -d {{.WSL_DISTRO}} -e bash -c "ssh {{.REMOTE_USER}}@{{.REMOTE_HOST}} 'docker ps --format \"table {{.Names}}\t{{.Status}}\"'"

  logs:
    desc: "コンテナログを表示 (例: task logs -- grafana)"
    cmds:
      - wsl -d {{.WSL_DISTRO}} -e bash -c "ssh {{.REMOTE_USER}}@{{.REMOTE_HOST}} 'docker logs --tail 50 monitoring-lab-{{.CLI_ARGS}}'"

  # ========== 設定ファイル同期 ==========

  sync:prometheus:
    desc: "Prometheus 設定を同期・ホットリロード"
    cmds:
      - wsl -d {{.WSL_DISTRO}} -e bash -c "cd /mnt/e/work/labo && {{.SYNC_SCRIPT}} prometheus"

  sync:alertmanager:
    desc: "Alertmanager 設定を同期・ホットリロード（Webhook URL を .env から注入）"
    cmds:
      - wsl -d {{.WSL_DISTRO}} -e bash -c "cd /mnt/e/work/labo && {{.SYNC_SCRIPT}} alertmanager"

  sync:grafana:
    desc: "Grafana ダッシュボード・データソースを同期・再起動"
    cmds:
      - wsl -d {{.WSL_DISTRO}} -e bash -c "cd /mnt/e/work/labo && {{.SYNC_SCRIPT}} grafana"

  sync:snmp:
    desc: "SNMP Exporter 設定を同期・再起動"
    cmds:
      - wsl -d {{.WSL_DISTRO}} -e bash -c "cd /mnt/e/work/labo && {{.SYNC_SCRIPT}} snmp"

  sync:tempo:
    desc: "Grafana Tempo 設定を同期・再起動"
    cmds:
      - wsl -d {{.WSL_DISTRO}} -e bash -c "cd /mnt/e/work/labo && {{.SYNC_SCRIPT}} tempo"

  sync:otel-collector:
    desc: "OTel Collector 設定を同期・再起動"
    cmds:
      - wsl -d {{.WSL_DISTRO}} -e bash -c "cd /mnt/e/work/labo && {{.SYNC_SCRIPT}} otel-collector"

  sync:all:
    desc: "全サービスの設定を同期"
    cmds:
      - wsl -d {{.WSL_DISTRO}} -e bash -c "cd /mnt/e/work/labo && {{.SYNC_SCRIPT}} all"

  tekken:update:
    desc: "tekken_bot プロジェクトから tekken.json をコピー（その後 sync:grafana で反映）"
    cmds:
      - wsl -d {{.WSL_DISTRO}} -e bash -c "cd /mnt/e/work/labo && {{.SYNC_SCRIPT}} tekken-update"

  # ========== Terragrunt ==========

  tg:plan:
    desc: "terragrunt run --all plan（全サービス差分確認）"
    cmds:
      - wsl -d {{.WSL_DISTRO}} -e bash -c "docker exec monitoring-lab-terragrunt sh -c 'cd /workspace/terraform/envs/local && TG_NON_INTERACTIVE=true terragrunt run --all plan 2>&1'"

  tg:plan:svc:
    desc: "特定サービスの plan（例: task tg:plan:svc -- prometheus）"
    cmds:
      - wsl -d {{.WSL_DISTRO}} -e bash -c "docker exec monitoring-lab-terragrunt sh -c 'cd /workspace/terraform/envs/local/{{.CLI_ARGS}} && terragrunt plan 2>&1'"

  tg:apply:svc:
    desc: "特定サービスの apply（例: task tg:apply:svc -- alertmanager）"
    cmds:
      - wsl -d {{.WSL_DISTRO}} -e bash -c "docker exec monitoring-lab-terragrunt sh -c 'cd /workspace/terraform/envs/local/{{.CLI_ARGS}} && terragrunt apply -auto-approve 2>&1'"

  # ========== Vault ==========

  vault:check:
    desc: "Vault API 疎通確認（initialized: true / sealed: false）"
    cmds:
      - wsl -d {{.WSL_DISTRO}} -e bash -c "curl -s http://{{.REMOTE_HOST}}:8200/v1/sys/health | python3 -m json.tool"

  vault:store:
    desc: "vault-secrets workspace で terragrunt apply（Slack Webhook URL を Vault に格納）"
    cmds:
      - wsl -d {{.WSL_DISTRO}} -e bash -c "source /mnt/e/work/labo/.env 2>/dev/null; export VAULT_ADDR=http://{{.REMOTE_HOST}}:8200; docker compose -f /mnt/e/work/labo/docker-compose.yml exec -T -e VAULT_ADDR=$$VAULT_ADDR -e VAULT_TOKEN=$${VAULT_TOKEN:-root} -e SLACK_WEBHOOK_URL=$$SLACK_WEBHOOK_URL -e POSTGRES_PASSWORD=$${POSTGRES_PASSWORD:-zabbix_password} -e GRAFANA_ADMIN_PASSWORD=$${GRAFANA_ADMIN_PASSWORD:-admin} terragrunt sh -c 'cd /workspace/terraform/envs/local/vault-secrets && terragrunt apply -auto-approve'"

  # ========== SLO 管理 (Sloth) ==========

  slo:generate:
    desc: "Sloth で SLO YAML から Prometheus ルールを生成 (config/prometheus/slo-rules.yml)"
    cmds:
      - wsl -d {{.WSL_DISTRO}} -e bash -c "docker run --rm -v /mnt/e/work/labo/config/sloth:/input:ro -v /mnt/e/work/labo/config/prometheus:/output ghcr.io/slok/sloth:v0.11.0 generate -i /input/monitoring-lab.yml -o /output/slo-rules.yml && echo 'Generated: config/prometheus/slo-rules.yml'"

  slo:validate:
    desc: "生成された slo-rules.yml を promtool で文法チェック"
    cmds:
      - wsl -d {{.WSL_DISTRO}} -e bash -c "docker run --rm --entrypoint promtool -v /mnt/e/work/labo/config/prometheus:/etc/prometheus:ro prom/prometheus:latest check rules /etc/prometheus/slo-rules.yml"

  # ========== 監視・確認 ==========

  health:
    desc: "各サービスの死活確認（HTTP ヘルスチェック）"
    cmds:
      - wsl -d {{.WSL_DISTRO}} -e bash -c |
          echo "=== Prometheus ===" && curl -sf http://{{.REMOTE_HOST}}:9090/-/healthy && echo "OK" || echo "FAIL"
          echo "=== Alertmanager ===" && curl -sf http://{{.REMOTE_HOST}}:9093/-/healthy && echo "OK" || echo "FAIL"
          echo "=== Grafana ===" && curl -sf http://{{.REMOTE_HOST}}:3000/api/health | grep -q '"database": "ok"' && echo "OK" || echo "FAIL"

  reload:prometheus:
    desc: "Prometheus をホットリロード（設定ファイルは変更せず）"
    cmds:
      - wsl -d {{.WSL_DISTRO}} -e bash -c "ssh {{.REMOTE_USER}}@{{.REMOTE_HOST}} 'curl -sf -X POST http://localhost:9090/-/reload'"

  reload:alertmanager:
    desc: "Alertmanager をホットリロード（設定ファイルは変更せず）"
    cmds:
      - wsl -d {{.WSL_DISTRO}} -e bash -c "ssh {{.REMOTE_USER}}@{{.REMOTE_HOST}} 'curl -sf -X POST http://localhost:9093/-/reload'"
