# ==========================================
# Terragrunt Development Environment
# ==========================================
# このDocker Composeファイルは、Terragruntを
# コンテナ環境で実行するための開発環境を提供します。
# (Terragruntイメージには既にTerraformが含まれています)

services:
  # ==========================================
  # Terragrunt CLI Container (with Terraform)
  # ==========================================
  terragrunt:
    # Alpine LinuxベースのTerragruntイメージ
    image: alpine/terragrunt:latest

    container_name: monitoring-lab-terragrunt

    # コンテナを起動したままにする + SSH鍵コピー
    entrypoint: /bin/sh
    command:
      - -c
      - |
        mkdir -p /root/.ssh
        chmod 700 /root/.ssh
        # RSA鍵のコピー
        if [ -f /tmp/ssh-keys/id_rsa ]; then
          cp /tmp/ssh-keys/id_rsa /root/.ssh/id_rsa
          cp /tmp/ssh-keys/id_rsa.pub /root/.ssh/id_rsa.pub
          chmod 600 /root/.ssh/id_rsa
          chmod 644 /root/.ssh/id_rsa.pub
          echo "SSH RSA keys copied successfully"
        fi
        # Ed25519鍵のコピー
        if [ -f /tmp/ssh-keys/id_ed25519 ]; then
          cp /tmp/ssh-keys/id_ed25519 /root/.ssh/id_ed25519
          cp /tmp/ssh-keys/id_ed25519.pub /root/.ssh/id_ed25519.pub
          chmod 600 /root/.ssh/id_ed25519
          chmod 644 /root/.ssh/id_ed25519.pub
          echo "SSH Ed25519 keys copied successfully"
        fi
        # known_hostsがあればコピー
        if [ -f /tmp/ssh-keys/known_hosts ]; then
          cp /tmp/ssh-keys/known_hosts /root/.ssh/known_hosts
          chmod 644 /root/.ssh/known_hosts
        fi
        tail -f /dev/null

    working_dir: /workspace

    # ボリュームマウント（Terraformと同じ）
    volumes:
      - .:/workspace
      - terraform-plugin-cache:/root/.terraform.d/plugin-cache
      - terragrunt-cache:/root/.terragrunt-cache
      - ${SSH_KEYS_DIR}:/tmp/ssh-keys:ro  # SSH鍵を一時ディレクトリにマウント

    # 環境変数
    env_file:
      - .env  # .envファイルから環境変数を読み込み
    environment:
      # TF_LOGを設定しない（デバッグログを無効化）
      - TF_PLUGIN_CACHE_DIR=/root/.terraform.d/plugin-cache
      - TZ=Asia/Tokyo

      # Terragrunt設定
      - TG_DOWNLOAD_DIR=/root/.terragrunt-cache
      - TG_NON_INTERACTIVE=true

      # HCP Terraform設定
      - TF_TOKEN_app_terraform_io=${TF_TOKEN_app_terraform_io}
      - TF_CLOUD_ORGANIZATION=${TF_CLOUD_ORGANIZATION}
      - TF_CLOUD_WORKSPACE=${TF_CLOUD_WORKSPACE}

      # New Relic設定
      - NEW_RELIC_LICENSE_KEY=${NEW_RELIC_LICENSE_KEY}
      - NEW_RELIC_ACCOUNT_ID=${NEW_RELIC_ACCOUNT_ID}
      - NEW_RELIC_REGION=${NEW_RELIC_REGION}
      - NEW_RELIC_DISPLAY_NAME=${NEW_RELIC_DISPLAY_NAME}

    networks:
      - terraform-network

    depends_on:
      - vault-dev

    labels:
      - "project=monitoring-lab"
      - "component=terragrunt"

  # ==========================================
  # Vault (Development Mode)
  # ==========================================
  # Terraform/TerragruntからVaultに接続するための開発用Vault
  vault-dev:
    image: hashicorp/vault:latest

    container_name: monitoring-lab-vault-dev

    # ポート公開
    ports:
      - "8200:8200"  # Vault API/UI

    # 環境変数（開発モード）
    environment:
      # 開発モード有効化
      - VAULT_DEV_ROOT_TOKEN_ID=root
      - VAULT_DEV_LISTEN_ADDRESS=0.0.0.0:8200
      - VAULT_LOG_LEVEL=info
      - VAULT_ADDR=http://0.0.0.0:8200

    # ヘルスチェック
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 10s
      timeout: 5s
      retries: 5

    # キャパビリティ（IPC_LOCK）
    cap_add:
      - IPC_LOCK

    networks:
      - terraform-network

    labels:
      - "project=monitoring-lab"
      - "component=vault"

# ==========================================
# Networks
# ==========================================
networks:
  terraform-network:
    name: monitoring-lab-terraform-network
    driver: bridge

# ==========================================
# Volumes
# ==========================================
volumes:
  # Terraformプラグインキャッシュ（永続化）
  terraform-plugin-cache:
    name: monitoring-lab-terraform-plugin-cache

  # Terragruntキャッシュ（永続化）
  terragrunt-cache:
    name: monitoring-lab-terragrunt-cache
