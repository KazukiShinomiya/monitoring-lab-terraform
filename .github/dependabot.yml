version: 2
updates:
  - package-ecosystem: npm
    directory: /mcp/docker-server
    schedule:
      interval: weekly
    labels:
      - dependencies
      - mcp
    groups:
      # api / sdk-metrics / resources / exporter は互いの版を縛るので、1 本の PR で上げる
      opentelemetry:
        patterns:
          - "@opentelemetry/*"

  - package-ecosystem: npm
