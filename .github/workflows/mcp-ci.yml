name: MCP Server CI

on:
  push:
    paths:
      - 'mcp/**'
  pull_request:
    paths:
      - 'mcp/**'

jobs:
  build-and-test:
    name: Build & Test (${{ matrix.server }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        server:
          - docker-server
          - prometheus-server
          - terragrunt-server

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: mcp/${{ matrix.server }}/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: mcp/${{ matrix.server }}

      - name: TypeScript build
        run: npm run build
        working-directory: mcp/${{ matrix.server }}

      - name: Unit tests
        run: npm test
        working-directory: mcp/${{ matrix.server }}
